# Сборка Android-приложения StudyPlay (APK) на серверах GitHub.
# Запускается сама, когда меняются файлы приложения или общий сборщик; можно и вручную (Actions → Run workflow).
# Готовый файл: Releases → «StudyPlay для Android» → StudyPlay.apk (ссылка на сайте ведёт туда).
name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'app/android/**'
      - 'js/sync/collector.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        working-directory: app/android
        run: npm install --no-audit --no-fund

      - name: Background check script (collector + runner)
        working-directory: app/android
        run: |
          mkdir -p www/runners
          cat ../../js/sync/collector.js runners/check.template.js > www/runners/check.js

      - name: Android project
        working-directory: app/android
        run: |
          npx cap add android
          npx cap sync android
          # своё главное окно: края экрана в Расписании — для листания недель (app/android/native/MainActivity.java)
          cp native/MainActivity.java native/SPGesturesPlugin.java android/app/src/main/java/kz/studyplay/app/
          # номер версии растёт с каждой сборкой — телефон поставит её поверх старой
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # уведомления на Android 13+
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # фоновой проверке (Background Runner) нужен её JS-движок из node_modules — по документации плагина
          printf "\nrepositories {\n    flatDir {\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'\n    }\n}\n" >> android/app/build.gradle
          grep -n "versionCode\|versionName\|flatDir" android/app/build.gradle

      - name: Build
        working-directory: app/android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ключ подписи создаётся один раз на компьютере владельца (файл «Создать ключ Android.bat»)
      # и лежит в секретах репозитория; без него сборка проверяется, но в Releases ничего не попадает
      - name: Signing key present?
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Нет ключа подписи — APK собран, но не подписан и не выложен. Запустите «Создать ключ Android.bat»."; fi

      - name: Sign
        if: steps.key.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > ks.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/android/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias studyplay --key-pass env:KS_PASS --out StudyPlay.apk aligned.apk
          "$BT/apksigner" verify StudyPlay.apk
          rm -f ks.p12

      - name: Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "StudyPlay для Android" --notes "Приложение StudyPlay для Android. Установка: скачайте StudyPlay.apk на телефон и откройте. Новые версии ставятся поверх старой." --latest=false
          gh release upload android-latest StudyPlay.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: StudyPlay-apk
          path: |
            StudyPlay.apk
            app/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
