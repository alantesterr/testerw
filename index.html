  <!-- Тема, размер шрифта и панель применяются до отрисовки (без «мигания») -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('sp-settings') || '{}') || {};
        var t = s.theme || (localStorage.getItem('studyplay-hub-theme') || 'system');
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var h = document.documentElement;
        h.setAttribute('data-theme', t);
        h.setAttribute('data-font', s.font || 'm');
        h.setAttribute('data-sidebar', s.sidebar || 'expanded');
        if (s.lang) h.lang = s.lang;
      } catch (e) { /* хранилище недоступно — используем значения по умолчанию */ }
    })();
  </script>
